name: Operator console

on:
  push:
    paths:
      - "apps/StratusConsole/**"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "apps/StratusConsole/**"
      - ".github/workflows/console.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build apps/StratusConsole/StratusConsole.csproj -c Release -p:Platform=x64
