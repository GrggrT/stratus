name: Operator console

on:
  # The console consumes backend DTO/API contracts, so backend-only changes
  # must compile it as well. Keeping this workflow unconditional prevents a
  # green backend CI from shipping a broken operator application.
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.301"

      - name: Restore locked dependencies
        run: >-
          dotnet restore apps/StratusConsole/StratusConsole.csproj
          -p:Platform=x64 --locked-mode

      - name: Build
        # Compilation check only: trimming and R2R belong to the publish
        # step and require a self-contained app (NETSDK1102 otherwise).
        run: >-
          dotnet build apps/StratusConsole/StratusConsole.csproj
          -c Release -p:Platform=x64 --no-restore
          -p:PublishTrimmed=false -p:PublishReadyToRun=false
