name: CI

on:
  push:
  pull_request:

jobs:
  release-contracts-windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release contracts on Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\tests\Test-StratusDashboardLoadGate.ps1
          .\scripts\tests\Test-StratusRuntimeLoadObserver.ps1
          .\scripts\tests\Test-StratusLoadGateArtifacts.ps1
          .\scripts\tests\Test-StratusReleaseImage.ps1
          .\scripts\tests\Test-StratusPreStartTopology.ps1
          .\scripts\tests\Test-StratusReleaseRunbook.ps1
          .\scripts\tests\Test-StratusPreMigrationBackupGate.ps1
          .\scripts\tests\Test-StratusPostMigrationSuccessorGate.ps1
          .\scripts\tests\Test-StratusStoppedPostgresNetworkRepair.ps1
          .\scripts\tests\Test-StratusSuccessorTransitionWatchdog.ps1
          .\scripts\tests\Test-StratusPaperCanary.ps1
          .\scripts\tests\Test-StratusPaperCanaryArtifacts.ps1
          .\scripts\tests\Test-StratusPaperCanaryStopBarrier.ps1

      - name: Validate Windows-only successor contracts on PowerShell 7
        shell: pwsh
        run: |
          .\scripts\tests\Test-StratusPostMigrationSuccessorGate.ps1
          .\scripts\tests\Test-StratusStoppedPostgresNetworkRepair.ps1
          .\scripts\tests\Test-StratusSuccessorTransitionWatchdog.ps1

  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_DB: stratus_test
          POSTGRES_USER: stratus
          POSTGRES_PASSWORD: stratus
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U stratus -d stratus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check src tests migrations

      - name: Type check
        run: uv run mypy src/stratus

      - name: Validate read-only Dashboard load gate
        shell: pwsh
        run: ./scripts/tests/Test-StratusDashboardLoadGate.ps1

      - name: Validate read-only runtime load observer
        shell: pwsh
        run: ./scripts/tests/Test-StratusRuntimeLoadObserver.ps1

      - name: Validate composite load-gate evidence assertion
        shell: pwsh
        run: ./scripts/tests/Test-StratusLoadGateArtifacts.ps1

      - name: Validate immutable release-image guard behavior
        shell: pwsh
        run: ./scripts/tests/Test-StratusReleaseImage.ps1

      - name: Validate read-only pre-start topology guard
        shell: pwsh
        run: ./scripts/tests/Test-StratusPreStartTopology.ps1

      - name: Validate release runbook commands
        shell: pwsh
        run: ./scripts/tests/Test-StratusReleaseRunbook.ps1

      - name: Validate pre-migration backup/restore gate
        shell: pwsh
        run: ./scripts/tests/Test-StratusPreMigrationBackupGate.ps1

      - name: Validate Polymarket PAPER canary collector
        shell: pwsh
        run: ./scripts/tests/Test-StratusPaperCanary.ps1

      - name: Validate immutable PAPER canary artifacts
        shell: pwsh
        run: ./scripts/tests/Test-StratusPaperCanaryArtifacts.ps1

      - name: Validate fail-closed PAPER canary STOP barrier
        shell: pwsh
        run: ./scripts/tests/Test-StratusPaperCanaryStopBarrier.ps1

      - name: Test (unit + Postgres integration)
        env:
          STRATUS_TEST_DATABASE_URL: postgresql+asyncpg://stratus:stratus@localhost:5432/stratus_test
        run: uv run pytest -q

      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-only-owner-password-000000000000
          STRATUS_RUNTIME_PASSWORD_FILE: ${{ runner.temp }}/stratus_runtime_password
          STRATUS_SAFETY_PASSWORD_FILE: ${{ runner.temp }}/stratus_safety_password
          OPERATOR_API_KEY: op_CI7m2Q9x4R8v3T6w1Y5z0N7p2C9f4H8j3L6s1D5a0
          SAFETY_API_KEY: safe_CI3n8B1k6P9r4X7m2Q5t0W8y3F6h1J9c4L7s2Z5
        run: |
          umask 077
          for name in COMPOSE_FILE COMPOSE_PROFILES COMPOSE_PROJECT_NAME COMPOSE_PATH_SEPARATOR; do
            test -z "${!name+x}"
          done
          compose_env="$RUNNER_TEMP/stratus-release-compose.env"
          : > "$compose_env"
          compose_args=(
            --project-directory "$GITHUB_WORKSPACE"
            -f "$GITHUB_WORKSPACE/docker-compose.yml"
            --env-file "$compose_env"
            --project-name weatherpoly
          )
          printf '%s\n' 'ci-only-runtime-password-00000000' \
            > "$STRATUS_RUNTIME_PASSWORD_FILE"
          printf '%s\n' 'ci-only-safety-password-000000000' \
            > "$STRATUS_SAFETY_PASSWORD_FILE"
          docker compose "${compose_args[@]}" config --quiet
          default_services="$(docker compose "${compose_args[@]}" config --services | sort)"
          test -z "$default_services"
          release_services="$(docker compose "${compose_args[@]}" --profile release config --services | sort)"
          expected_release_services="$(printf '%s\n' \
            api backup migrate postgres provision-runtime-role \
            provision-safety-role safety-control validate-owner-password \
            validate-safety-credentials worker | sort)"
          test "$release_services" = "$expected_release_services"
          profiled_services="$(docker compose "${compose_args[@]}" \
            --profile release --profile infrastructure --profile binance \
            --profile telegram --profile offsite \
            config --services | sort)"
          expected_profiled_services="$(printf '%s\n' \
            api backup backup-offsite binance-market-stream migrate postgres \
            provision-runtime-role provision-safety-role safety-control telegram \
            validate-owner-password validate-safety-credentials worker | sort)"
          test "$profiled_services" = "$expected_profiled_services"
          docker compose "${compose_args[@]}" --profile release run --rm --no-deps validate-owner-password
          docker compose "${compose_args[@]}" --profile release run --rm --no-deps validate-safety-credentials

      - name: Docker build
        env:
          POSTGRES_PASSWORD: ci-only-owner-password-000000000000
          STRATUS_RUNTIME_PASSWORD_FILE: ${{ runner.temp }}/stratus_runtime_password
          STRATUS_SAFETY_PASSWORD_FILE: ${{ runner.temp }}/stratus_safety_password
          OPERATOR_API_KEY: op_CI7m2Q9x4R8v3T6w1Y5z0N7p2C9f4H8j3L6s1D5a0
          SAFETY_API_KEY: safe_CI3n8B1k6P9r4X7m2Q5t0W8y3F6h1J9c4L7s2Z5
        run: |
          candidate="stratus:candidate-${GITHUB_SHA:0:12}"
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$candidate" .
          test "$(docker image inspect "$candidate" --format '{{.Os}}/{{.Architecture}}')" \
            = "linux/amd64"
          test "$(docker image inspect "$candidate" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" \
            = "${GITHUB_SHA}"
          image_id="$(docker image inspect "$candidate" --format '{{.Id}}')"
          case "$image_id" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
          digest="${image_id#sha256:}"
          test "${#digest}" -eq 64
          printf '%s\n' "$digest" | grep -Eq '^[0-9a-f]{64}$'
          release_env="${RUNNER_TEMP}/stratus-release.env"
          printf 'STRATUS_IMAGE=%s\nSTRATUS_RELEASE_IMAGE_DIGEST=%s\n' \
            "$candidate" "$digest" > "$release_env"
          export STRATUS_IMAGE="$candidate"
          export STRATUS_RELEASE_IMAGE_DIGEST="$digest"
          guard_result="$(pwsh -NoLogo -NoProfile -File \
            ./scripts/Assert-StratusReleaseImage.ps1 \
            -Image "$candidate" \
            -ExpectedDigest "$digest" \
            -ExpectedRevision "$GITHUB_SHA" \
            -EnvFile "$release_env" \
            -Root "$GITHUB_WORKSPACE")"
          printf '%s\n' "$guard_result"
          printf '%s\n' "$guard_result" | grep -q '"verified":true'
