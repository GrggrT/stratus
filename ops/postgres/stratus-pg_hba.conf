# STRATUS production authentication boundary (PostgreSQL 16).
#
# This cluster is dedicated to the fixed Compose database `stratus`.  The
# database-scoped application login is derived as:
#
#   stratus_app_ || md5('stratus')
#
# Keep the exact target allow before the family-wide reject.  The reject is
# deliberately a PostgreSQL-16 HBA user regular expression: it prevents a
# scoped application role created for any sibling/test database from falling
# through to the general SCRAM rule and connecting across databases through
# PUBLIC CONNECT.  This file is mounted outside PGDATA, so changing it requires
# at least a PostgreSQL configuration reload; the controlled Compose release
# procedure restarts PostgreSQL and verifies pg_hba_file_rules before runtime
# services are admitted.

# TYPE   DATABASE  USER                                            ADDRESS       METHOD
local    stratus   stratus_app_752875213a111f12d876fef68bbf8259                  scram-sha-256
local    all       /^stratus_app_[0-9a-f]{32}$                                   reject

host     stratus   stratus_app_752875213a111f12d876fef68bbf8259    0.0.0.0/0     scram-sha-256
host     all       /^stratus_app_[0-9a-f]{32}$                    0.0.0.0/0     reject

host     stratus   stratus_app_752875213a111f12d876fef68bbf8259    ::/0            scram-sha-256
host     all       /^stratus_app_[0-9a-f]{32}$                    ::/0            reject

# Migration, role provisioning, backup, and operator maintenance use the
# owner login.  Password authentication remains SCRAM on every transport.
local    all       all                                                           scram-sha-256
host     all       all                                             0.0.0.0/0     scram-sha-256
host     all       all                                             ::/0            scram-sha-256
